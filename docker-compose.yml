# Local development dependencies only. Production uses Supabase for both
# PostgreSQL and Storage; nothing here is deployed.
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: leasereminder-postgres
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: leasereminder
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leasereminder"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
